<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Launcher</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="canvas-container"></div>

    <div class="app-shell">
      <header class="hero">
        <p class="eyebrow">Viewing Multiple Projects from Github Repositories</p>
        <h1>View My Projects</h1>
        <p class="subtitle">Some roses are red, some violets are blue, below you can pick one of the two.</p>
      </header>

      <div class="controls">
        <label class="search-label" for="project-search">
          Search projects
          <input id="project-search" type="search" placeholder="Filter by name..." autocomplete="off" />
        </label>
      </div>

      <main class="cards" id="projectCards"></main>

      <footer class="site-footer">
        <p>🌸 Click any card to open the live demo · 🔗 All projects are hosted on GitHub Pages</p>
      </footer>
    </div>

    <script src="p5.min.js"></script>
    <script src="config.js"></script>
    <script src="sketch.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
